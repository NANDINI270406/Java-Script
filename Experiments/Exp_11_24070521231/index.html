<!DOCTYPE html>
<html>
<head>
<title>Countdown Timer</title>
</head>
<body>

<h2 id="timer">10</h2>

<script>
let time = 10;

let timer = setInterval(() => {
document.getElementById("timer").textContent = time;
time--;

if (time < 0) {
clearInterval(timer);
alert("Class Started!");
}
}, 1000);
</script>

</body>
</html>
